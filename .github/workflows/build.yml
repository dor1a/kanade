name: build

# Branches only run the checks. Images are built for version tags:
# vX.Y.Z gets X.Y.Z, X.Y, and latest; vX.Y.Z-rc.N gets only its own tag.
on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install --no-deps -r requirements-nodeps.txt
      - run: python -m compileall -q kanade
      - run: python -c "import kanade.artists, kanade.bot, kanade.browse, kanade.config, kanade.index, kanade.player, kanade.plex, kanade.reading, kanade.text"

  # apt and pip run inside the arm64 image, so that platform builds under QEMU.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      STABLE: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.STABLE }}
            type=raw,value=latest,enable=${{ env.STABLE }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
